name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Check for hardcoded API keys
        run: |
          echo "Checking for hardcoded API keys..."
          # Look for actual OpenAI-style secret keys (sk-proj-, sk-[0-9a-f]{48}, etc.)
          # while avoiding false positives on words like risk-* or disk-*.
          matches=$(grep -rEn "sk-[a-zA-Z0-9_-]{20,}" --include="*.ts" --include="*.tsx" --include="*.js" --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.github --exclude="*config*" src/ | grep -v "\.env" | grep -v "process\.env" | grep -v "//.*sk-" | grep -v "risk-" | grep -v "task-" | grep -v "disk-" || true)
          if [ -n "$matches" ]; then
            echo "Possible hardcoded key-like strings found:"
            echo "$matches"
            exit 1
          fi
          echo "No hardcoded API keys found"

      - name: Check for console.log with error dumps
        run: |
          echo "Checking for raw error dumps in console.log..."
          ! grep -r "console.log.*JSON.stringify" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=.next src/ | grep -i "error" && echo "No raw error dumps in console.log"

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/postgres' }}
